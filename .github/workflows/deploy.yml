name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:

  # ── Job 1: Deploy Hosting (always runs) ────────────────────────────────────
  deploy-hosting:
    name: Deploy Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:              ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId:              bal-gopal-mitra-mandal
          channelId:              live
          target:                 bal-gopal-mitra-mandal

  # ── Job 2: Deploy Firestore + Storage rules (only when rules files change) ─
  deploy-rules:
    name: Deploy Security Rules
    runs-on: ubuntu-latest
    # Only run this job when rule files are actually changed
    if: |
      contains(github.event.commits[0].modified, 'firestore.rules') ||
      contains(github.event.commits[0].modified, 'storage.rules') ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: admin-panel   # firebase.json lives here
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore & Storage rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy \
            --only firestore:rules,storage:rules \
            --project bal-gopal-mitra-mandal \
            --non-interactive
