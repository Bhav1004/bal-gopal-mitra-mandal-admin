name: Deploy to Firebase (Hosting + Rules)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Deploy Firebase Hosting (HTML admin panel) ─────────────────────────
      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:               ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId:               bal-gopal-mitra-mandal
          channelId:               live
          target:                  bal-gopal-mitra-mandal

      # ── 2. Deploy Firestore + Storage security rules ──────────────────────────
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore & Storage rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy \
            --only firestore:rules,storage:rules \
            --project bal-gopal-mitra-mandal \
            --non-interactive
