<!-- ── Step 1: Login handler defined BEFORE Firebase loads ───────────────── -->
<!-- This tiny script block is standalone — zero dependencies, cannot fail   -->
<script>
window.doLogin = function(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  var email  = document.getElementById('loginEmail').value.trim();
  var pw     = document.getElementById('loginPw').value;
  var errEl  = document.getElementById('loginError');
  var btn    = document.getElementById('loginBtn');
  function showErr(msg) {
    if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
    if (btn)   { btn.textContent = 'Sign In'; btn.disabled = false; }
  }
  if (!email || !pw) { showErr('Please enter email and password.'); return false; }
  if (!window._fbAuth) { showErr('Firebase loading... please wait 2 seconds and try again.'); return false; }
  if (btn) { btn.textContent = 'Signing in\u2026'; btn.disabled = true; }
  if (errEl) errEl.style.display = 'none';
  window._fbAuth.signInWithEmailAndPassword(email, pw)
    .then(function() { /* onAuthStateChanged handles redirect */ })
    .catch(function(err) {
      var msgs = {
        'auth/invalid-credential':    'Invalid email or password.',
        'auth/user-not-found':        'No account found with this email.',
        'auth/wrong-password':        'Incorrect password.',
        'auth/invalid-email':         'Please enter a valid email.',
        'auth/too-many-requests':     'Too many failed attempts. Try again in a few minutes.',
        'auth/network-request-failed':'Network error. Please check your connection.'
      };
      showErr(msgs[err.code] || ('Error: ' + err.message + ' [' + err.code + ']'));
    });
  return false;
};
</script>

var state = { user: null, page: 'login', loading: false, data: {}, albums: [], activeAlbum: null };

function toast(msg, ok) {

// ── Auth state ────────────────────────────────────────────────────────────────
auth.onAuthStateChanged(function(user) {
  state.user = user;
  if (user) {

function logout() { auth.signOut(); }

          '<button id="loginBtn" type="submit" style="width:100%;background:#ea580c;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer">Sign In</button>' +

function sidebar() {

// ── Firestore helpers ─────────────────────────────────────────────────────────
function col(name) { return db.collection(name); }
function addFsDoc(name, data) { return col(name).add(data); }
function setFsDoc(name, id, data) { return col(name).doc(id).set(data, {merge:true}); }
function delFsDoc(name, id) { return col(name).doc(id).delete(); }
function getAll(name, order, dir) {
  return col(name).orderBy(order || 'timestamp', dir || 'desc').get()
    .then(function(s) { return s.docs.map(function(d) { var o = d.data(); o.id = d.id; return o; }); });
}

// ── Page loaders ──────────────────────────────────────────────────────────────
function loadAndRender(page) {
  state.loading = true;
  var load;
  if (page === 'dashboard') {
    load = Promise.all([col('updates').get(), col('aartis').get(), col('feedback').get(), col('device_tokens').get()])
      .then(function(results) {
        var unread = results[2].docs.filter(function(d) { return !d.data().isRead; }).length;
        state.data = { updates: results[0].size, aartis: results[1].size, feedback: results[2].size, unread: unread, devices: results[3].size };
      });
  } else if (page === 'updates')  { load = getAll('updates').then(function(l) { state.data.list = l; }); }
  else if (page === 'schedule')   { load = getAll('schedule', 'dayNumber', 'asc').then(function(l) { state.data.list = l; }); }
  else if (page === 'aarti')      { load = getAll('aartis', 'order', 'asc').then(function(l) { state.data.list = l; }); }
  else if (page === 'feedback')   { load = getAll('feedback').then(function(l) { state.data.list = l; }); }
  else if (page === 'gallery')    {
    load = col('gallery').orderBy('year', 'desc').get()
      .then(function(s) { state.albums = s.docs.map(function(d) { var o = d.data(); o.id = d.id; return o; }); });
  } else if (page === 'notifications') {
    load = Promise.all([
      col('device_tokens').get(),
      col('notification_history').orderBy('sentAt', 'desc').limit(20).get()
    ]).then(function(r) {
      state.data.deviceCount = r[0].size;
      state.data.notifHistory = r[1].docs.map(function(d) { var o = d.data(); o.id = d.id; return o; });
    });
  } else { load = Promise.resolve(); }

  load.catch(function(e) { toast('Load error: ' + e.message, false); })
    .then(function() {
      state.loading = false;
      renderPage(page);
    });
}

function renderPage(page) {
  var pages = {
    dashboard: renderDashboard, updates: renderUpdates, schedule: renderSchedule,
    aarti: renderAarti, feedback: renderFeedback, gallery: renderGallery,
    notifications: renderNotifications,
    settings: renderSettings
  };
  if (pages[page]) pages[page]();
}

// ── Page headers ──────────────────────────────────────────────────────────────
function pageHeader(title, sub, btnLabel, btnFn) {

// Convert "HH:MM" (24h) to "H:MM AM/PM" display string
function toDisplay12h(hhmm) {
  if (!hhmm) return '';
  var p = hhmm.split(':'); var h = parseInt(p[0]); var m = p[1] || '00';
  var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
}
// Convert "H:MM AM/PM" back to "HH:MM" for <input type="time">
function to24h(display) {
  if (!display) return '';
  var m = display.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return display;
  var h = parseInt(m[1]); var min = m[2]; var ap = m[3].toUpperCase();
  if (ap === 'PM' && h !== 12) h += 12;
  if (ap === 'AM' && h === 12) h = 0;
  return h.toString().padStart(2,'0') + ':' + min;
}

function saveSched(id) {

  }).filter(function(e) { return e.name; });
  var data = {dayNumber:dayNumber, date:date, dayName_en:dayNameEn, dayName_mr:dayNameMr, events:events};
  var p = id ? setFsDoc('schedule', id, data) : addFsDoc('schedule', data);

function uploadPhotos(files) {
  if (!files || files.length === 0) return;
  if (!state.activeAlbum) {
    toast('Select or create an album first, then upload photos.', false);
    return;
  }
  if (!IMGBB_API_KEY || IMGBB_API_KEY.length < 8) {
    toast('ImgBB API key is missing or too short. Check the IMGBB_API_KEY value in index.html.', false);
    return;
  }

  var a = state.activeAlbum;
  var done = 0, failed = 0, total = files.length, newPhotos = [];

  toast('Uploading ' + total + ' photo(s)…');

  Array.from(files).forEach(function(f) {
    if (f.size > 32 * 1024 * 1024) {
      toast('File "' + f.name + '" is too large (max 32 MB)', false);
      failed++; done++;
      if (done === total) finishUpload(newPhotos, failed, a);
      return;
    }

    var fd = new FormData();
    fd.append('image', f);
    fd.append('name', f.name.replace(/\.[^/.]+$/, ''));

    fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
      method: 'POST',
      body: fd
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data.success) throw new Error(data.error && data.error.message || 'Upload failed');
        newPhotos.push({
          url:        data.data.url,          // full-size display URL
          thumb:      data.data.thumb.url,    // thumbnail URL
          deleteUrl:  data.data.delete_url,   // save this to allow deletion
          timestamp:  Date.now()
        });
      })
      .catch(function(e) {
        failed++;
        console.error('ImgBB upload error:', e);
        toast('Upload failed: ' + e.message, false);
      })
      .finally(function() {
        done++;
        if (done === total) finishUpload(newPhotos, failed, a);
      });
  });
}

function finishUpload(newPhotos, failed, a) {
  if (newPhotos.length === 0) {
    toast('All uploads failed. Check your ImgBB API key.', false);
    return;
  }
  var photos = (a.photos || []).concat(newPhotos);
  setFsDoc('gallery', a.id, { photos: photos, coverUrl: photos[0].url }).then(function() {
    state.activeAlbum.photos = photos;
    state.activeAlbum.coverUrl = photos[0].url;
    toast(newPhotos.length + ' photo(s) uploaded' + (failed ? ', ' + failed + ' failed' : '') + ' ✅');
    renderGallery();
  });
}

function delPhoto(idx) {

  var a = state.activeAlbum;

  if (photo.deleteUrl) {
    window.open(photo.deleteUrl, '_blank');

  var photos = a.photos.filter(function(_, i) { return i !== idx; });
  setFsDoc('gallery', a.id, { photos: photos, coverUrl: photos[0] ? photos[0].url : '' }).then(function() {
    state.activeAlbum.photos = photos;
    toast('Photo deleted'); renderGallery();
  });

var WORKER_URL   = 'https://frosty-salad-a110.bhavin-others.workers.dev';  // FCM notifications
var IMGBB_API_KEY = '97c2626cc542c4d8a3d886add65e775e';  // ← paste your key from api.imgbb.com (free, no credit card)

function sendNotif() {
  var title  = $('nTitle') ? $('nTitle').value.trim() : '';
  var body   = $('nBody')  ? $('nBody').value.trim()  : '';
  var status = $('notifStatus');
  var btn    = $('sendBtn');

  if (!title || !body) { toast('Title and body required', false); return; }
  if (btn) { btn.textContent = 'Sending\u2026'; btn.disabled = true; }
  if (status) status.style.display = 'none';

  // 1. Read all device tokens from Firestore
  col('device_tokens').get().then(function(snap) {
    var tokens = snap.docs.map(function(d) { return d.data().token; }).filter(Boolean);

    if (tokens.length === 0) {
      if (btn) { btn.textContent = 'Send to All Devices'; btn.disabled = false; }
      if (status) {
        status.textContent = '\u26A0\uFE0F No registered devices found. Install the app on a phone first.';
        status.style.cssText = 'display:block;color:#d97706';
      }
      return Promise.reject('no-tokens');
    }

    if (status) {
      status.textContent = 'Sending to ' + tokens.length + ' device(s)\u2026';
      status.style.cssText = 'display:block;color:#6b7280';
    }

    // 2. Worker takes one token per request — send all in parallel
    var requests = tokens.map(function(token) {
      return fetch(WORKER_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token: token, title: title, body: body })
      }).then(function(res) { return res.json(); })
        .then(function(json) {
          // FCM v1 success: { name: "projects/.../messages/..." }
          // FCM v1 error:   { error: { code, message, status } }
          if (json.name) return { result: 'ok' };
          var errMsg = (json.error && (json.error.message || json.error.status)) || JSON.stringify(json);
          return { result: 'fail', reason: errMsg };
        })
        .catch(function(e) { return { result: 'fail', reason: e.message }; });
    });

    return Promise.all(requests).then(function(results) {
      var ok      = results.filter(function(r) { return r.result === 'ok'; }).length;
      var fails   = results.filter(function(r) { return r.result === 'fail'; });
      var failReasons = fails.map(function(f) { return f.reason; }).filter(function(r,i,a) { return a.indexOf(r) === i; });

      if (btn) { btn.textContent = 'Send to All Devices'; btn.disabled = false; }
      if (status) {
        var msg = ok > 0
          ? '\u2705 Done! ' + ok + ' delivered' + (fails.length ? ', ' + fails.length + ' failed' : '') + ' out of ' + tokens.length + ' device(s).'
          : '\u274C All ' + fails.length + ' failed. Reason: ' + (failReasons[0] || 'unknown');
        if (fails.length && ok > 0) msg += ' Failure: ' + failReasons.join('; ');
        status.textContent = msg;
        status.style.cssText = 'display:block;color:' + (ok === 0 ? '#dc2626' : '#16a34a') + ';font-weight:500';
      }

      // 3. Log to Firestore history
      addFsDoc('notification_history', {
        title: title, body: body,
        sentAt:       new Date(),
        sentBy:       state.user ? state.user.email : 'admin',
        successCount: ok,
        failureCount: fails.length,
        totalDevices: tokens.length
      });

      if ($('nTitle')) $('nTitle').value = '';
      if ($('nBody'))  $('nBody').value  = '';
      setTimeout(function() { loadAndRender('notifications'); }, 1500);
    });

  }).catch(function(err) {
    if (err === 'no-tokens') return;
    if (btn) { btn.textContent = 'Send to All Devices'; btn.disabled = false; }
    if (status) {
      status.textContent = '\u26A0\uFE0F Error: ' + (err.message || err);
      status.style.cssText = 'display:block;color:#dc2626';
    }
  });
}

        '<p style="font-size:12px;color:#6b7280;margin-bottom:16px">Controls the countdown timer, festival day badge, and "Today" highlighting in the schedule. Saves to <code>config/festival</code>.</p>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">' +
          fld('Festival Name', '<input id="fName" class="inp" value="' + esc(d.name || 'Ganeshotsav 2026') + '" placeholder="Ganeshotsav 2026"/>') +
          fld('Start Year', '<input id="fYear" class="inp" type="number" value="' + (d.startYear || 2026) + '"/>') +
          fld('Total Days', '<input id="fDays" class="inp" type="number" value="' + (d.totalDays || 10) + '" min="1" max="20"/>') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">' +
          fld('Start Month (1=Jan … 8=Aug)', '<input id="fMonth" class="inp" type="number" min="1" max="12" value="' + (d.startMonth || 8) + '"/>') +
          fld('Start Day', '<input id="fDay" class="inp" type="number" min="1" max="31" value="' + (d.startDay || 22) + '"/>') +
        '</div>' +
        '<button class="btn btn-primary" onclick="saveFestivalConfig()">Save Festival Config</button>' +
      '</div>'
    );
  }).catch(function() {
    toast('Could not load config — check Firestore rules for config collection', false);
  });
}

function saveFestivalConfig() {
  var data = {
    name:       $('fName').value.trim(),
    startYear:  parseInt($('fYear').value),
    startMonth: parseInt($('fMonth').value),
    startDay:   parseInt($('fDay').value),
    totalDays:  parseInt($('fDays').value)
  };
  db.doc('config/festival').set(data)
    .then(function() { toast('\uD83C\uDF89 Festival config saved! App will reflect changes on next launch.'); })
    .catch(function(e) { toast('Save failed: ' + e.message, false); });
}
window.saveFestivalConfig = saveFestivalConfig;

})(); // end IIFE
